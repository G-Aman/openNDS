name: Build openNDS 10.3.1 (aarch64 musl)

# Stock v10.3.1 + upstream commits bf5e6374 and d6ba05f1, built against
# musl 1.2.5 (same libc the router runs). Artifact -> /usr/bin/opennds.

on:
  workflow_dispatch:
  push:
    branches: [ndsctl-fix]

concurrency:
  group: opennds-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow repo (for the patch)
        uses: actions/checkout@v4

      - name: Pristine openNDS v10.3.1
        uses: actions/checkout@v4
        with:
          repository: openNDS/openNDS
          ref: v10.3.1
          path: src

      - name: Apply upstream ndsctl fixes
        run: |
          patch -p1 -d src --batch < patches/ndsctl-thread-fix.patch
          echo "--- hunks applied ---"
          grep -c "^@@" patches/ndsctl-thread-fix.patch
          echo "--- upstream code present? ---"
          grep -n "ndsctl_resume_accept" src/src/ndsctl_thread.c | head -3
          grep -n "is a byte count" src/src/ndsctl_thread.c

      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine 3.20 (musl 1.2.5)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/src:/src" -w /src \
            alpine:3.20 \
            sh -lc 'set -e; apk add --no-cache build-base linux-headers libmicrohttpd-dev; make CC=gcc LDLIBS=-lmicrohttpd opennds; strip opennds'

      - name: Show what was built
        run: |
          ls -l src/opennds
          sha256sum src/opennds
          readelf -h src/opennds | grep -E "Class|Machine|Type"
          readelf -d src/opennds | grep -E "NEEDED" || true
          strings src/opennds | grep -m1 "This is openNDS version" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opennds-10.3.1-aarch64-upstream
          path: src/opennds
          if-no-files-found: error
