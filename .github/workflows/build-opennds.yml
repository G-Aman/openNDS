name: Build openNDS 10.3.1 + ndsctl fix, with A/B proof

# Builds pristine v10.3.1 AND v10.3.1 + the two ndsctl hunks in the same
# container, then diffs the two binaries to prove the fix is really in the
# artifact. Artifact = patched binary (+ the A/B evidence).

on:
  workflow_dispatch:
  push:
    branches: [ndsctl-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow repo (patch + workflow)
        uses: actions/checkout@v4

      - name: Pristine openNDS v10.3.1 (stock copy)
        uses: actions/checkout@v4
        with:
          repository: openNDS/openNDS
          ref: v10.3.1
          path: src-stock

      - name: Pristine openNDS v10.3.1 (patched copy)
        uses: actions/checkout@v4
        with:
          repository: openNDS/openNDS
          ref: v10.3.1
          path: src-patched

      - name: Apply the ndsctl control-thread fix
        run: |
          patch -p1 -d src-patched < patches/ndsctl-thread-fix.patch
          echo "--- patched source sanity ---"
          grep -c "errno == EINTR" src-patched/src/ndsctl_thread.c
          grep -n "Neither is a byte count" src-patched/src/ndsctl_thread.c
          echo "--- stock source must NOT contain it ---"
          ! grep -q "Neither is a byte count" src-stock/src/ndsctl_thread.c

      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Build both, diff the machine code
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            alpine:3.20 \
            sh -lc '
              set -e
              apk add --no-cache build-base linux-headers libmicrohttpd-dev >/dev/null
              for d in src-stock src-patched; do
                ( cd $d && make CC=gcc LDLIBS=-lmicrohttpd opennds >/dev/null 2>&1 ) \
                  || { echo "BUILD FAILED: $d"; cd $d && make CC=gcc LDLIBS=-lmicrohttpd opennds; exit 1; }
                objdump -d $d/opennds > $d.full.asm
              done
              echo "=== binary sizes ==="
              ls -l src-stock/opennds src-patched/opennds
              echo "=== sha256 ==="
              sha256sum src-stock/opennds src-patched/opennds
              echo "=== symbol table check ==="
              nm src-stock/opennds    | grep -w ndsctl_handler || true
              nm src-patched/opennds  | grep -w ndsctl_handler || true
              echo "=== __errno_location call sites (patched must be higher) ==="
              s=$(grep -c "call.*__errno_location" src-stock.full.asm || true)
              p=$(grep -c "call.*__errno_location" src-patched.full.asm || true)
              echo "stock=$s patched=$p"
              [ "$p" -gt "$s" ] || { echo "PROOF FAILED: no extra errno check"; exit 1; }
              echo "=== instruction diff (should be confined to ndsctl code) ==="
              diff -u src-stock.full.asm src-patched.full.asm > ab.diff || true
              echo "diff lines: $(wc -l < ab.diff)"
              head -60 ab.diff
              echo "=== diff touches ndsctl_handler? ==="
              grep -c "ndsctl_handler" ab.diff
              strip src-patched/opennds
            '

      - name: Show what was built
        run: |
          ls -l src-patched/opennds
          readelf -h src-patched/opennds | grep -E "Class|Machine|Type"
          readelf -d src-patched/opennds | grep -E "NEEDED" || true
          strings src-patched/opennds | grep -m1 "This is openNDS version" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opennds-10.3.1-aarch64-musl
          path: |
            src-patched/opennds
            ab.diff
          if-no-files-found: error
