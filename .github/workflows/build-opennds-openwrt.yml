name: Build openNDS for OpenWrt

on:
  workflow_dispatch:
    inputs:
      opennds_ref:
        description: "Branch or tag in THIS repo to build (e.g. 11.0.00, master)"
        required: true
        default: "11.0.00"
        type: string
      sdk_preset:
        description: "Select OpenWrt SDK target (ignored if Custom SDK tag is filled)"
        required: true
        type: choice
        default: "armsr-armv8-25.12.5"
        options:
          - armsr-armv8-25.12.5        # aarch64_generic
          - bcm27xx-bcm2711-25.12.5    # aarch64_cortex-a72
          - mediatek-filogic-25.12.5   # aarch64_cortex-a53
      custom_sdk_tag:
        description: "Optional: Manual SDK tag override (e.g. armsr-armv8-24.10.0)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.opennds_ref }}

      - name: Build openNDS in OpenWrt SDK container
        env:
          SDK_TAG: ${{ inputs.custom_sdk_tag != '' && inputs.custom_sdk_tag || inputs.sdk_preset }}
        run: |
          mkdir -p "${{ github.workspace }}/out"
          chmod 777 "${{ github.workspace }}/out"

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/out:/out" \
            "ghcr.io/openwrt/sdk:${SDK_TAG}" \
            bash -euo pipefail -c '
              cd /builder
              [ ! -d ./scripts ] && ./setup.sh
              ./scripts/feeds update packages routing
              ./scripts/feeds install opennds

              cp -rf /src /tmp/opennds-src

              make defconfig
              make package/opennds/compile USE_SOURCE_DIR=/tmp/opennds-src -j$(nproc) V=s

              find /builder/bin/packages -type f \( -name "opennds*.ipk" -o -name "opennds*.apk" \) -exec cp -v {} /out/ \;
              ls -lh /out/
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennds-${{ inputs.opennds_ref }}-${{ inputs.custom_sdk_tag != '' && inputs.custom_sdk_tag || inputs.sdk_preset }}
          path: ${{ github.workspace }}/out/*
          
