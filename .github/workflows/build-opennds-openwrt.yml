name: Build openNDS for OpenWrt

on:
  workflow_dispatch:
    inputs:
      opennds_ref:
        description: "Branch or tag in THIS repo to build"
        required: true
        default: "11.0.00"
        type: string
      sdk_preset:
        description: "OpenWrt SDK target"
        required: true
        type: choice
        default: "armsr-armv8-25.12.5"
        options:
          - armsr-armv8-25.12.5
          - bcm27xx-bcm2711-25.12.5
          - mediatek-filogic-25.12.5
      custom_sdk_tag:
        description: "Optional SDK tag override"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openNDS source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.opennds_ref }}

      - name: Build openNDS package
        env:
          SDK_TAG: ${{ inputs.custom_sdk_tag != '' && inputs.custom_sdk_tag || inputs.sdk_preset }}
        run: |
          mkdir -p "${{ github.workspace }}/out"
          chmod 777 "${{ github.workspace }}/out"
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/out:/out" \
            "ghcr.io/openwrt/sdk:${SDK_TAG}" \
            bash -euo pipefail -c '
              cd /builder
              if [ ! -x ./scripts/feeds ]; then ./setup.sh; fi
              if [ ! -f feeds.conf ]; then cp feeds.conf.default feeds.conf; fi
              rm -rf /tmp/opennds-src /tmp/localfeed
              cp -a /src /tmp/opennds-src
              mkdir -p /tmp/localfeed/net/opennds
              cp /tmp/opennds-src/linux_openwrt/opennds/Makefile /tmp/localfeed/net/opennds/Makefile
              # Fix PKG_HASH with correct SHA256 for v11.0.0 tarball
              sed -i "s|^PKG_HASH:=.*|PKG_HASH:=33940f8ef52e958cdf37fd49ca20a8140b85a096d529cf4e0122592ac24ced00|" /tmp/localfeed/net/opennds/Makefile
              # Add missing PKG_BUILD_DIR (11.0.00 branch lacks it; tarball extracts to openNDS-11.0.0 uppercase)
              grep -q "^PKG_BUILD_DIR:" /tmp/localfeed/net/opennds/Makefile || \
                sed -i "/^PKG_BUILD_PARALLEL:=/a PKG_BUILD_DIR:=\$\$(BUILD_DIR)/openNDS-\$\$(PKG_VERSION)" /tmp/localfeed/net/opennds/Makefile
              grep -q "^src-link localfeed " feeds.conf || echo "src-link localfeed /tmp/localfeed" >> feeds.conf
              ./scripts/feeds update -a
              ./scripts/feeds install libmicrohttpd
              ./scripts/feeds install -p localfeed -f opennds
              make defconfig
              make package/opennds/compile -j\$(nproc) V=s
              find /builder/bin -type f \( -name "opennds*.apk" -o -name "opennds*.ipk" \) -exec cp -v {} /out/ \;
              ls -lh /out
              find /out -type f \( -name "opennds*.apk" -o -name "opennds*.ipk" \) | grep -q .
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: opennds-${{ inputs.opennds_ref }}-${{ inputs.custom_sdk_tag != '' && inputs.custom_sdk_tag || inputs.sdk_preset }}
          path: out/*
          if-no-files-found: error
